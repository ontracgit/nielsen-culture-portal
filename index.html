<title>Culture Activation Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@tavus/embed@latest"></script>
<style>
:root{
  color-scheme:light;
  --navy:#002041; --gray:#F7F7F9; --gray2:#ECECF1; --line:#E2E3EA;
  --purple:#6E37FA; --aqua:#32BBB9; --orange:#FF9408; --red:#F40953;
  --magenta:#FA32A0; --eggplant:#B30095; --canary:#FFD500; --chartreuse:#AAF564; --mint:#50E6AA; --cobalt:#2765F0;
  --ink:#0B0F1A; --muted:#5B6476;
  --r:12px; --max:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
@media(max-width:640px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--navy)}
.logo svg{width:34px;height:24px}
.divider{width:1px;height:26px;background:var(--line)}
.prod{font-size:14px;font-weight:600;color:var(--muted);line-height:1.15}
.prod b{display:block;color:var(--navy);font-size:15px}
.bar .sp{flex:1}
.demo-pill{font-size:12px;font-weight:600;color:var(--purple);background:#F0EBFF;padding:6px 10px;border-radius:99px;white-space:nowrap}
.menu-btn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px}
.menu-btn svg{width:18px;height:18px}
@media(max-width:760px){.prod,.divider,.demo-pill{display:none}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,32,65,.45);opacity:0;pointer-events:none;transition:.25s;z-index:80}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:90;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.menu-open .scrim{opacity:1;pointer-events:auto}
body.menu-open .drawer{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:18px;font-weight:700}
.close{width:36px;height:36px;border-radius:10px;background:var(--gray);display:grid;place-items:center}
.drawer nav{overflow:auto;padding:12px}
.drawer nav a{display:flex;align-items:center;gap:14px;padding:12px;border-radius:10px;font-weight:500}
.drawer nav a:hover,.drawer nav a.on{background:var(--gray)}
.drawer nav .n{font-size:12px;font-weight:700;color:var(--muted);width:22px}
.drawer nav .ic{width:34px;height:34px;flex:none}
.drawer nav small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff}
.hero .wrap{position:relative;z-index:2;padding-top:88px;padding-bottom:96px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.02em}
.hero .eyebrow{color:var(--aqua)}
.hero h1{font-size:clamp(38px,5.6vw,68px);line-height:1.04;letter-spacing:-.03em;font-weight:700;max-width:760px;margin:14px 0 22px}
.hero p{font-size:19px;font-weight:300;max-width:560px;color:#D5DCE8}
.hero .cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:13px 20px;border-radius:10px}
.btn.primary{background:#fff;color:var(--navy)}
.btn.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
.spectrum{position:absolute;right:-6%;top:0;height:100%;width:58%;z-index:1}
.hero .copy{max-width:560px}
.hero h1{font-size:clamp(36px,4.6vw,60px)}

/* hero visuals (4 options) */
.hv{position:absolute;top:0;right:0;bottom:0;width:52%;z-index:1;overflow:hidden}
.hv .ph{background-size:cover;background-position:center}
/* A: bands */
.hv-a .band{position:absolute;inset:0}
.hv-a .band.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(110,55,250,.25),rgba(50,187,185,.15))}
/* B: play triangle */
.hv-b svg{position:absolute;inset:0;width:100%;height:100%}
.hv-b .bubble{position:absolute;width:96px;height:96px;border-radius:50%;border:4px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.3)}
/* C: mosaic */
.hv-c{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 0 0 12px}
.hv-c .colm{display:flex;flex-direction:column;gap:12px}
.hv-c .colm:nth-child(1){margin-top:-60px}.hv-c .colm:nth-child(2){margin-top:30px}.hv-c .colm:nth-child(3){margin-top:-20px}
.hv-c .t{border-radius:12px;flex:none;height:190px;position:relative;overflow:hidden}
.hv-c .t.word{display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;height:130px}
.hv-c .t.word b{font-size:22px;letter-spacing:-.02em}
.hv-c .t.word span{font-size:12px;opacity:.85}
.hv-c:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--navy) 0,rgba(0,32,65,0) 22%),linear-gradient(0deg,var(--navy) 0,rgba(0,32,65,0) 14%)}
/* D: portraits on bands */
.hv-d .face{position:absolute;border-radius:50%;border:4px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.hv-d .kudo{position:absolute;background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.22);display:flex;gap:8px;align-items:center;white-space:nowrap}
.hv-d .kudo i{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;padding:3px 7px;border-radius:5px}

.picker{position:absolute;z-index:5;right:max(20px,env(safe-area-inset-right,0px));bottom:18px;display:flex;align-items:center;gap:6px;background:rgba(0,32,65,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);padding:6px 6px 6px 12px;border-radius:12px;color:#fff;font-size:12px}
.picker span{color:#AEB9CC;font-weight:600;margin-right:4px}
.picker button{padding:6px 10px;border-radius:8px;font-weight:600;font-size:12px;color:#D5DCE8}
.picker button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.picker button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

@media(max-width:900px){
  .hero .wrap{padding-bottom:40px}
  .hv{position:relative;width:100%;height:340px}
  .hv-c:before{background:linear-gradient(0deg,var(--navy) 0,rgba(0,32,65,0) 18%),linear-gradient(180deg,var(--navy) 0,rgba(0,32,65,0) 14%)}
  .picker{position:relative;right:auto;bottom:auto;margin:14px auto 24px;width:max-content;max-width:calc(100% - 32px);flex-wrap:wrap}
  .hero .copy{max-width:none}
}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;max-width:720px;border-top:1px solid rgba(255,255,255,.15)}
.stats div{padding:18px 18px 0 0}
.stats b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em}
.stats span{font-size:13px;color:#AEB9CC}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- section heads ---------- */
.block{padding:88px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.head h2{font-size:clamp(28px,3.4vw,42px);letter-spacing:-.025em;line-height:1.1;font-weight:700;margin-top:8px}
.head p{color:var(--muted);max-width:440px;font-size:16px}

/* ---------- card grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{position:relative;background:var(--gray);border-radius:var(--r);padding:26px 24px 22px;display:flex;flex-direction:column;min-height:270px;transition:transform .2s,box-shadow .2s,background .2s;outline:none}
.card:hover,.card:focus-visible{transform:translateY(-4px);background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 40px -18px rgba(0,32,65,.28)}
.card .num{position:absolute;top:20px;right:22px;font-size:44px;font-weight:800;color:var(--gray2);letter-spacing:-.04em;line-height:1;transition:color .2s}
.card:hover .num{color:var(--c)}
.card .ic{width:52px;height:52px;margin-bottom:22px}
.card h3{font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.card p{color:var(--muted);font-size:14.5px;margin-top:8px;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;font-weight:600}
.card .foot .count{color:var(--muted);font-weight:500}
.card .foot .go{color:var(--c);display:flex;gap:6px;align-items:center}
.card .bar-c{position:absolute;left:24px;top:0;width:36px;height:4px;border-radius:0 0 4px 4px;background:var(--c)}

/* journey strip */
.journey{background:var(--gray);border-radius:var(--r);padding:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px}
.journey div{position:relative}
.journey b{font-size:15px;display:block;margin:10px 0 4px}
.journey span{font-size:14px;color:var(--muted)}
.journey i{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--navy);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
@media(max-width:820px){.journey{grid-template-columns:repeat(2,1fr)}}

/* ---------- section page ---------- */
.s-hero{background:var(--gray);position:relative;overflow:hidden}
.s-hero .wrap{padding-top:40px;padding-bottom:56px;position:relative;z-index:2}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.crumbs a:hover{color:var(--navy);text-decoration:underline}
.s-hero .row{display:flex;gap:28px;align-items:center;margin-top:34px}
.s-hero .ic{width:84px;height:84px;flex:none;background:#fff;border-radius:20px;padding:14px}
.s-hero .eyebrow{color:var(--c)}
.s-hero h1{font-size:clamp(32px,4.4vw,52px);letter-spacing:-.03em;line-height:1.05;margin:6px 0 10px}
.s-hero p{font-size:18px;color:var(--muted);font-weight:300;max-width:640px}
.s-hero .big{position:absolute;right:24px;bottom:-40px;font-size:260px;font-weight:800;color:#fff;letter-spacing:-.06em;line-height:1;z-index:1}
@media(max-width:640px){.s-hero .row{flex-direction:column;align-items:flex-start}.s-hero .big{font-size:160px}}

.why{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:48px 0 8px}
.why .q{background:var(--navy);color:#fff;border-radius:var(--r);padding:28px}
.why .q b{font-size:22px;line-height:1.3;letter-spacing:-.01em;display:block}
.why .q span{display:block;margin-top:14px;color:#AEB9CC;font-size:14px}
.why .o{background:var(--gray);border-radius:var(--r);padding:28px}
.why .o h4{font-size:13px;color:var(--c);font-weight:700;margin-bottom:10px}
.why .o ul{list-style:none;display:grid;gap:8px}
.why .o li{display:flex;gap:10px;font-size:15px}
.why .o li:before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c);margin-top:8px;flex:none}
@media(max-width:820px){.why{grid-template-columns:1fr}}

.els{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:40px}
.el{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .2s, transform .2s}
.el:hover{box-shadow:0 18px 40px -22px rgba(0,32,65,.35);transform:translateY(-2px)}
.pv{height:170px;background:var(--gray);position:relative;overflow:hidden;display:grid;place-items:center;padding:18px}
.el .body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.el h4{font-size:17px;font-weight:700;letter-spacing:-.01em}
.el p{font-size:14px;color:var(--muted);margin-top:6px;flex:1}
.tags{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--gray);color:var(--navy)}
.tag.mvp{background:var(--navy);color:#fff}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:64px}
.pager a{border-radius:var(--r);background:var(--gray);padding:22px 24px;display:block;transition:background .2s}
.pager a:hover{background:var(--gray2)}
.pager small{font-size:12px;color:var(--muted);font-weight:600}
.pager b{display:block;font-size:18px;margin-top:4px}
.pager .nx{text-align:right}

/* ---------- mini previews ---------- */
.m{width:100%;max-width:250px}
.m-card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 0 var(--line)}
.ln{height:6px;border-radius:3px;background:var(--gray2);margin:5px 0}
.ln.s{width:55%}.ln.m2{width:75%}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.play{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.play:after{content:"";border-left:12px solid var(--navy);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.chip{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:3px 7px;border-radius:5px}
.flex{display:flex;gap:6px;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:28px 0 40px;margin-top:40px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
footer b{color:var(--navy)}

/* ---------- nielsen.com alignment: pills, heavy tight heads, contained hero ---------- */
.btn,.pill{border-radius:999px;font-weight:600;transition:background .2s,color .2s,border-color .2s}
.btn{padding:14px 28px;font-size:16px}
.btn.primary,.pill.primary{background:var(--purple);color:#fff;border:2px solid var(--purple)}
.btn.primary:hover,.pill.primary:hover{background:#5A22E6;border-color:#5A22E6}
.btn.ghost{border:2px solid #fff;color:#fff}
.btn.ghost:hover{background:#fff;color:var(--navy)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 22px;font-size:15px}
.pill.outline{border:2px solid var(--purple);color:var(--purple);background:transparent}
.pill.outline:hover,.card:hover .pill.outline{background:var(--purple);color:#fff}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
.logo:focus-visible,.topnav a:focus-visible,.menu-btn:focus-visible{outline:3px solid var(--aqua);outline-offset:3px;border-radius:6px}
.btn:focus-visible,.pill:focus-visible,.card:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}

header{background:#fff;border-bottom:0;box-shadow:0 1px 0 var(--line)}
.bar{height:84px;gap:28px}
.logo{font-size:26px;letter-spacing:-.03em}
.logo svg{width:40px;height:28px}
.topnav{display:flex;gap:34px;font-size:16px;font-weight:500;color:var(--navy)}
.topnav a{position:relative;padding:6px 0}
.topnav a:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--purple);transform:scaleX(0);transition:transform .2s}
.topnav a:hover:after{transform:scaleX(1)}
.demo-pill{background:var(--gray2);color:var(--navy);padding:9px 16px;font-size:13px}
.menu-btn{background:transparent;color:var(--purple);border:2px solid var(--purple);border-radius:999px;padding:10px 22px;font-size:15px}
.menu-btn:hover{background:var(--purple);color:#fff}
.topnav a,.menu-btn,.prod,.prod b{white-space:nowrap}
.topnav{gap:28px}
@media(max-width:1320px){.topnav{display:none}}
@media(max-width:760px){.bar{height:68px}.logo{font-size:22px}}

.hero{width:min(calc(100% - 64px),calc(var(--max) - 64px));margin:24px auto 0;border-radius:20px}
.hero .wrap{padding-top:72px;padding-bottom:84px}
.hero .eyebrow{color:#fff;font-weight:500;font-size:14px;opacity:.85}
.hero h1{font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
@media(min-width:901px){.hero .copy{max-width:640px}.hv{width:46%}}
.hero p{font-weight:400;font-size:18px;line-height:1.65}
.stats{border-top-color:rgba(255,255,255,.2)}
.stats b{font-weight:800;letter-spacing:-.03em}
@media(max-width:640px){.hero{width:calc(100% - 32px);margin-top:16px;border-radius:16px}.hero .wrap{padding-top:48px}}

.head .eyebrow{color:var(--navy)!important;font-weight:500;font-size:14px;letter-spacing:0}
.head h2{font-weight:800;letter-spacing:-.04em;color:var(--navy);font-size:clamp(30px,3.8vw,48px);line-height:1.05;text-wrap:balance}

.card{border-radius:14px;padding:34px 30px 30px;min-height:300px}
.card:hover,.card:focus-visible{transform:none;background:var(--gray);box-shadow:none}
.card .bar-c,.card .num{display:none}
.card .ic{width:44px;height:44px;margin-bottom:20px}
.card h3{color:var(--c);font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.12;text-wrap:balance}
.card p{color:var(--navy);font-size:15.5px;line-height:1.7;margin-top:16px}
.card .foot{margin-top:26px}
.card .foot .count{font-size:13px}

.s-hero h1{font-weight:800;letter-spacing:-.04em;color:var(--navy)}
.s-hero p{color:var(--navy);font-weight:400}
.el h4{font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.pager b{font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.journey b{font-weight:800}

/* ---------- featured band (nielsen.com Insights style) ---------- */
.feat{background:linear-gradient(115deg,#1A0E8C 0%,#0E2A5E 42%,#2A0F45 78%,#3A0A35 100%);color:#fff;padding:88px 0 96px}
.feat .head .eyebrow{color:var(--aqua)!important;font-weight:600}
.feat .head h2{color:#fff}
.feat .head p{color:#C9D3E6}
.fcard{background:rgba(64,110,175,.28);border-radius:16px;overflow:hidden;display:grid}
.fcard .txt{padding:44px 48px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fcard .ey{color:var(--aqua);font-weight:600;font-size:17px}
.fcard h3{font-size:clamp(26px,2.6vw,36px);font-weight:800;letter-spacing:-.035em;line-height:1.08;text-wrap:balance}
.fcard p{color:#E3E9F4;font-size:16px;line-height:1.7}
.fcard .meta{display:flex;align-items:center;gap:18px;margin-top:auto;padding-top:22px;font-weight:600;font-size:15px}
.fcard .meta .tg{background:rgba(255,255,255,.14);padding:6px 12px;border-radius:6px}
.fcard .img{background-size:cover;background-position:center;min-height:300px}
.f-big{grid-template-columns:1fr 1.45fr;margin-bottom:28px}
.f-row{display:grid;grid-template-columns:2fr 1fr;gap:28px}
.f-mid{grid-template-columns:1fr 1fr}
.f-mid .art{min-height:340px}
.f-mid .art svg{width:100%;height:100%;display:block}
.f-side{grid-template-rows:auto 1fr}
.f-side .cover{position:relative;height:250px;background:linear-gradient(135deg,#F40953 0%,#FA32A0 70%,#FF6FB8 100%);clip-path:polygon(0 0,100% 0,100% 100%,0 86%);padding:28px 30px;display:flex;flex-direction:column;justify-content:center}
.f-side .cover small{font-weight:800;font-size:24px;letter-spacing:-.03em}
.f-side .cover b{font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:.9;text-transform:uppercase}
.f-side .txt{padding:28px 30px 34px}

.f-nia{align-items:center}
.nia-slot{width:auto;aspect-ratio:16/9;margin:24px;border-radius:12px;overflow:hidden;background:rgba(0,32,65,.55);min-width:0;max-width:100%}

.nia-missing{height:100%;display:grid;place-content:center;gap:6px;padding:20px;text-align:center;color:#C9D3E6;font-size:14px}

.f-nia .live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(80,230,170,.2)}

/* home stays mounted (parked off-screen) while a section is open, so a call with Nia survives navigation */
#homeView.parked{position:fixed;left:-300vw;top:0;width:100vw;visibility:hidden}
#homeView.parked .nia-slot{visibility:visible}

.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const C = {purple:'#6E37FA',aqua:'#32BBB9',orange:'#FF9408',red:'#F40953'};
const T = {purple:'#C5B0FD',aqua:'#A9E4E3',orange:'#FFD29A',red:'#FC9DBA'};

/* Simple two-tone icons in the Nielsen flat geometric style */
const ICONS = {
  compass:(a,b)=>`<circle cx="32" cy="32" r="24" fill="${b}"/><polygon points="32,14 38,32 32,50 26,32" fill="${a}"/><circle cx="32" cy="32" r="4" fill="#fff"/>`,
  game:(a,b)=>`<rect x="8" y="20" width="48" height="26" rx="13" fill="${a}"/><rect x="32" y="20" width="24" height="26" rx="13" fill="${b}"/><rect x="16" y="31" width="12" height="4" rx="2" fill="#fff"/><rect x="20" y="27" width="4" height="12" rx="2" fill="#fff"/><circle cx="44" cy="30" r="2.6" fill="#fff"/><circle cx="44" cy="37" r="2.6" fill="#fff"/>`,
  book:(a,b)=>`<rect x="12" y="10" width="32" height="44" rx="4" fill="${a}"/><rect x="40" y="10" width="12" height="44" rx="3" fill="${b}"/><rect x="18" y="20" width="16" height="4" rx="2" fill="#fff"/><rect x="18" y="28" width="12" height="4" rx="2" fill="#fff"/>`,
  star:(a,b)=>`<circle cx="32" cy="32" r="24" fill="${b}"/><polygon points="32,14 37,27 51,27 40,36 44,50 32,42 20,50 24,36 13,27 27,27" fill="${a}"/>`,
  flag:(a,b)=>`<rect x="14" y="8" width="5" height="50" rx="2.5" fill="${b}"/><path d="M19 10h28l-7 10 7 10H19z" fill="${a}"/>`,
  chat:(a,b)=>`<rect x="6" y="10" width="36" height="26" rx="8" fill="${a}"/><path d="M14 36v9l9-9z" fill="${a}"/><rect x="24" y="24" width="34" height="24" rx="8" fill="${b}"/><path d="M50 48v8l-8-8z" fill="${b}"/>`,
  bulb:(a,b)=>`<path d="M32 8a17 17 0 0 0-10 31v7h20v-7A17 17 0 0 0 32 8z" fill="${a}"/><path d="M32 8a17 17 0 0 1 10 31v7H32z" fill="${b}"/><rect x="24" y="49" width="16" height="6" rx="3" fill="${a}"/>`,
  hand:(a,b)=>`<circle cx="24" cy="22" r="10" fill="${a}"/><circle cx="42" cy="26" r="8" fill="${b}"/><path d="M8 54c0-11 7-18 16-18s16 7 16 18z" fill="${a}"/><path d="M30 54c1-9 6-14 12-14s12 5 12 14z" fill="${b}"/>`,
  rocket:(a,b)=>`<path d="M44 10c6 0 10 0 10 0s0 4 0 10c0 9-8 18-16 24l-8-8c6-8 15-26 14-26z" fill="${a}"/><circle cx="43" cy="21" r="4" fill="${b}"/><path d="M24 30l-10 2 8-10 8 0zM34 40l-2 10 10-8 0-8z" fill="${a}"/><rect x="10" y="44" width="10" height="4" rx="2" transform="rotate(-45 15 46)" fill="${b}"/><rect x="16" y="50" width="6" height="4" rx="2" transform="rotate(-45 19 52)" fill="${b}"/>`,
  bolt:(a,b)=>`<circle cx="32" cy="32" r="24" fill="${b}"/><polygon points="35,10 18,36 30,36 27,54 46,26 33,26" fill="${a}"/>`,
  chart:(a,b)=>`<rect x="10" y="30" width="10" height="24" rx="3" fill="${b}"/><rect x="27" y="18" width="10" height="36" rx="3" fill="${a}"/><rect x="44" y="26" width="10" height="28" rx="3" fill="${b}"/><path d="M28 8l4 4 8-8" stroke="${a}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
};
const icon=(k,col)=>`<svg class="ic" viewBox="0 0 64 64" aria-hidden="true">${ICONS[k](C[col],T[col])}</svg>`;

/* ---------- mini previews (illustrative only) ---------- */
const P = {
  video:c=>`<div class="m" style="aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,var(--navy),${c});display:grid;place-items:center;position:relative"><div class="play"></div><span class="chip" style="position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.35)">1:24</span></div>`,
  values:c=>`<div class="m flex" style="gap:8px;align-items:stretch">${[['Inclusion','#F40953'],['Courage','#FF9408'],['Growth','#B30095']].map(([n,k])=>`<div style="flex:1;background:${k};border-radius:8px;padding:10px 8px;color:#fff;height:110px;display:flex;flex-direction:column;justify-content:flex-end"><b style="font-size:12px">${n}</b><div class="ln" style="background:rgba(255,255,255,.5);width:80%"></div><div class="ln" style="background:rgba(255,255,255,.35);width:55%"></div></div>`).join('')}</div>`,
  timeline:c=>`<div class="m" style="position:relative;height:100px"><div style="position:absolute;left:0;right:0;top:50px;height:3px;background:var(--gray2)"></div>${[0,1,2,3].map(i=>`<div style="position:absolute;left:${i*30+4}%;top:${i%2?58:8}px;width:58px"><div class="dot" style="background:${i==3?c:'var(--navy)'};position:absolute;left:0;top:${i%2?-14:36}px"></div><div class="m-card" style="padding:6px"><b style="font-size:10px">${['1923','1950','2000s','Today'][i]}</b><div class="ln s"></div></div></div>`).join('')}</div>`,
  pledge:c=>`<div class="m col">${['Leadership pledge','I will model courage','I will listen first'].map((t,i)=>`<div class="m-card flex"><span style="width:26px;height:26px;border-radius:50%;background:${i?T.purple:c};flex:none"></span><div style="flex:1"><b style="font-size:11px">${t}</b><div class="ln s"></div></div></div>`).join('')}</div>`,
  doc:c=>`<div class="m m-card" style="padding:14px"><span class="chip" style="background:${c}">Charter</span><div class="ln m2" style="margin-top:10px;height:8px;background:var(--navy)"></div><div class="ln"></div><div class="ln m2"></div><div class="ln s"></div><div class="flex" style="margin-top:8px"><div class="ln" style="width:30%;background:${c}"></div><div class="ln" style="width:30%"></div></div></div>`,
  match:c=>`<div class="m flex" style="gap:10px"><div class="col" style="flex:1">${['Scenario A','Scenario B','Scenario C'].map((s,i)=>`<div class="m-card" style="font-size:10px;font-weight:600;${i==1?`outline:2px dashed ${c};transform:rotate(-3deg)`:''}">${s}</div>`).join('')}</div><div class="col" style="flex:1">${[['Inclusion','#F40953'],['Courage','#FF9408'],['Growth','#B30095']].map(([n,k])=>`<div style="border:2px dashed ${k};border-radius:8px;padding:8px;font-size:10px;font-weight:700;color:${k}">${n}</div>`).join('')}</div></div>`,
  branch:c=>`<div class="m m-card" style="padding:12px"><b style="font-size:11px">A client asks for data you're unsure of…</b><div class="col" style="margin-top:8px">${['Say yes, sort it later','Ask the team first','Flag the gap honestly'].map((o,i)=>`<div style="font-size:10px;padding:6px 8px;border-radius:6px;border:1px solid ${i==2?c:'var(--line)'};background:${i==2?c+'14':'#fff'};font-weight:${i==2?700:500}">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div></div>`,
  quiz:c=>`<div class="m m-card" style="padding:12px"><div class="flex" style="justify-content:space-between"><span class="chip" style="background:${c}">Q 3/10</span><b style="font-size:11px">⏱ 0:12</b></div><div class="ln m2" style="margin-top:10px;height:8px;background:var(--navy)"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">${[0,1,2,3].map(i=>`<div style="height:24px;border-radius:6px;background:${i==1?c:'var(--gray)'}"></div>`).join('')}</div></div>`,
  wheel:c=>`<div style="position:relative;width:130px;height:130px"><div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(#6E37FA 0 60deg,#32BBB9 0 120deg,#FF9408 0 180deg,#F40953 0 240deg,#2765F0 0 300deg,#FA32A0 0);border:5px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.12)"></div><div style="position:absolute;inset:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--navy)">SPIN</div><div style="position:absolute;top:-8px;left:57px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid var(--navy)"></div></div>`,
  bingo:c=>`<div style="display:grid;grid-template-columns:repeat(4,28px);gap:5px">${Array.from({length:16},(_,i)=>`<div style="width:28px;height:28px;border-radius:6px;background:${[0,5,10,15].includes(i)?c:'#fff'};box-shadow:0 1px 0 var(--line);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800">${[0,5,10,15].includes(i)?'✓':''}</div>`).join('')}</div>`,
  swipe:c=>`<div style="position:relative;width:160px;height:120px"><div class="m-card" style="position:absolute;inset:10px 6px 0 14px;transform:rotate(4deg)"></div><div class="m-card" style="position:absolute;inset:0 14px 10px 4px;transform:rotate(-5deg);padding:14px"><span class="chip" style="background:${c}">Myth or fact?</span><div class="ln m2" style="margin-top:10px;height:8px;background:var(--navy)"></div><div class="ln"></div><div class="flex" style="justify-content:space-between;margin-top:10px;font-size:14px"><b style="color:#F40953">✕</b><b style="color:#32BBB9">✓</b></div></div></div>`,
  puzzle:c=>`<div style="display:grid;grid-template-columns:repeat(3,38px);gap:4px">${Array.from({length:9},(_,i)=>`<div style="width:38px;height:38px;border-radius:7px;background:${i==4?'var(--navy)':i%2?c:T.purple};display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px">${i==4?'🔒':''}</div>`).join('')}</div>`,
  words:c=>`<div style="display:grid;grid-template-columns:repeat(6,22px);gap:3px">${'GROWTHXCOURAGEINCLUSIONBOLDNE'.slice(0,30).split('').map((ch,i)=>`<div style="width:22px;height:22px;border-radius:4px;background:${i<6?c:'#fff'};color:${i<6?'#fff':'var(--navy)'};display:grid;place-items:center;font-size:10px;font-weight:700;box-shadow:0 1px 0 var(--line)">${ch}</div>`).join('')}</div>`,
  persona:c=>`<div class="m m-card" style="padding:14px;text-align:center"><div style="width:46px;height:46px;border-radius:50%;margin:0 auto;background:conic-gradient(${c},#32BBB9,#FF9408,${c})"></div><b style="font-size:12px;display:block;margin-top:8px">Your superpower:</b><b style="font-size:15px;color:${c}">Courage</b><div class="ln m2" style="margin:6px auto 0"></div></div>`,
  module:c=>`<div class="m m-card" style="padding:12px"><div style="height:56px;border-radius:6px;background:linear-gradient(120deg,${c},${T.purple})"></div><b style="font-size:11px;display:block;margin-top:8px">Lesson 2 · Begin with trust</b><div style="height:5px;border-radius:3px;background:var(--gray2);margin-top:8px"><div style="width:60%;height:100%;border-radius:3px;background:${c}"></div></div><span style="font-size:10px;color:var(--muted)">4 min · 60%</span></div>`,
  audio:c=>`<div class="m m-card" style="padding:12px"><div class="flex"><div style="width:42px;height:42px;border-radius:8px;background:${c}"></div><div style="flex:1"><b style="font-size:11px">Leaders on Courage · Ep 4</b><div class="ln s"></div></div></div><div class="flex" style="gap:2px;margin-top:10px;height:26px;align-items:center">${Array.from({length:34},(_,i)=>`<span style="flex:1;border-radius:2px;height:${6+Math.abs(Math.sin(i*1.3))*20}px;background:${i<14?c:'var(--gray2)'}"></span>`).join('')}</div></div>`,
  article:c=>`<div class="m col">${[0,1].map(i=>`<div class="m-card flex" style="gap:10px"><div style="width:54px;height:44px;border-radius:6px;background:${i?T.purple:c};flex:none"></div><div style="flex:1"><div class="ln m2" style="background:var(--navy)"></div><div class="ln"></div><div class="ln s"></div></div></div>`).join('')}</div>`,
  poster:c=>`<div class="flex" style="gap:10px">${[c,'var(--navy)','#FF9408'].map((k,i)=>`<div style="width:62px;height:88px;border-radius:6px;background:${k};padding:8px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(${(i-1)*5}deg);box-shadow:0 6px 14px rgba(0,0,0,.12)"><div class="ln" style="background:rgba(255,255,255,.7)"></div><div class="ln s" style="background:rgba(255,255,255,.4)"></div></div>`).join('')}</div>`,
  toolkit:c=>`<div class="m" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${['Huddle guide','Openers','Activities','Slides'].map((t,i)=>`<div class="m-card" style="padding:9px"><span class="dot" style="background:${[c,'#32BBB9','#FF9408','#F40953'][i]}"></span><b style="font-size:10px;display:block;margin-top:4px">${t}</b><div class="ln s"></div></div>`).join('')}</div>`,
  list:c=>`<div class="m col">${[0,1,2].map(i=>`<div class="m-card flex"><span style="width:20px;height:20px;border-radius:5px;background:${i==0?c:'var(--gray2)'};flex:none"></span><div style="flex:1"><div class="ln m2"></div></div><span style="font-size:10px;color:var(--muted)">${[12,8,5][i]} min</span></div>`).join('')}</div>`,
  kudos:c=>`<div class="m col">${[['Priya → Sam','Courage','#FF9408'],['Leo → Ana','Inclusion','#F40953'],['Mia → Raj','Growth','#B30095']].map(([w,v,k])=>`<div class="m-card flex"><span style="width:24px;height:24px;border-radius:50%;background:${T.purple};flex:none"></span><div style="flex:1"><b style="font-size:10.5px">${w}</b><div class="ln s"></div></div><span class="chip" style="background:${k}">${v}</span></div>`).join('')}</div>`,
  profile:c=>`<div class="flex" style="gap:10px">${[c,'#32BBB9','#FF9408'].map((k,i)=>`<div class="m-card" style="width:70px;text-align:center;padding:10px 6px"><div style="width:34px;height:34px;border-radius:50%;background:${k};margin:0 auto"></div><div class="ln" style="margin-top:8px;background:var(--navy)"></div><div class="ln s" style="margin:0 auto"></div></div>`).join('')}</div>`,
  gallery:c=>`<div class="m" style="display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:50px 50px;gap:5px">${[c,'#32BBB9','#FF9408','#2765F0','#FA32A0'].map((k,i)=>`<div style="border-radius:6px;background:linear-gradient(135deg,${k},${k}AA);${i==0?'grid-row:span 2':''}"></div>`).join('')}</div>`,
  form:c=>`<div class="m m-card" style="padding:12px"><b style="font-size:11px">Share a story</b><div style="height:22px;border:1px solid var(--line);border-radius:6px;margin-top:8px"></div><div style="height:40px;border:1px solid var(--line);border-radius:6px;margin-top:6px"></div><div style="margin-top:8px;height:22px;width:70px;border-radius:6px;background:${c}"></div></div>`,
  trophy:c=>`<div class="m m-card" style="padding:14px;display:flex;gap:12px;align-items:center"><div style="width:60px;height:60px;border-radius:50%;background:${c};display:grid;place-items:center;color:#fff;font-size:26px">★</div><div style="flex:1"><span class="chip" style="background:var(--navy)">November</span><b style="font-size:12px;display:block;margin-top:6px">Spotlight: Data Science team</b><div class="ln"></div></div></div>`,
  progress:c=>`<div class="m m-card" style="padding:12px"><div class="flex" style="justify-content:space-between"><b style="font-size:11px">Day 12 of 30</b><b style="font-size:11px;color:${c}">40%</b></div><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:10px">${Array.from({length:30},(_,i)=>`<div style="height:12px;border-radius:3px;background:${i<12?c:'var(--gray2)'}"></div>`).join('')}</div></div>`,

document.addEventListener('tavus:tool-call',e=>{

  const reply=(status,output)=>{ if(tool_call_id&&el&&el.sendMessage) el.sendMessage({event_type:'conversation.tool_result',properties:{tool_call_id,output,status}}); };

});

function spectrum(cols){
  // nested chevrons echoing the brand motion spectrum
  // diagonal stepped bands, as on the brand guide covers
  return `<svg class="spectrum" viewBox="0 0 600 600" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${cols.map((c,i)=>{const x=170+i*48;return `<path d="M${x} 600 L${x+330} 0 L620 0 L620 600 Z" fill="${c}"/>`}).join('')}</svg>`;
}
function grad(a,b,n){const h=x=>parseInt(x,16);const A=[h(a.slice(1,3)),h(a.slice(3,5)),h(a.slice(5,7))],B=[h(b.slice(1,3)),h(b.slice(3,5)),h(b.slice(5,7))];return Array.from({length:n},(_,i)=>{const t=i/(n-1);return '#'+A.map((v,k)=>Math.round(v+(B[k]-v)*t).toString(16).padStart(2,'0')).join('')})}

const img=n=>`url('img/${n}.jpg')`;
function roundPoly(pts,r){
  // path through pts with rounded corners of radius r
  const n=pts.length;let d='';
  for(let i=0;i<n;i++){
    const p=pts[(i-1+n)%n],c=pts[i],q=pts[(i+1)%n];
    const v1=[p[0]-c[0],p[1]-c[1]],v2=[q[0]-c[0],q[1]-c[1]];
    const l1=Math.hypot(...v1),l2=Math.hypot(...v2);
    const a=[c[0]+v1[0]/l1*r,c[1]+v1[1]/l1*r],b=[c[0]+v2[0]/l2*r,c[1]+v2[1]/l2*r];
    d+=(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)+' Q'+c[0]+' '+c[1]+' '+b[0].toFixed(1)+' '+b[1].toFixed(1)+' ';
  }
  return d+'Z';
}

    return `<div class="hv hv-d" aria-hidden="true">${spectrum(grad('#6E37FA','#32BBB9',8)).replace('class="spectrum"','style="position:absolute;inset:0;width:100%;height:100%"')}

};

function section(id){
  const i=S.findIndex(s=>s.id===id); if(i<0) return false;
  const s=S[i], c=C[s.col], prev=S[(i-1+S.length)%S.length], next=S[(i+1)%S.length];
  secView.innerHTML=`<div class="view" style="--c:${c}">
  <section class="s-hero">
    <span class="big">${s.n}</span>
    <div class="wrap">
      <div class="crumbs"><a href="#home">Home</a> <span>/</span> <span>${s.title}</span></div>
      <div class="row">
        ${icon(s.icon,s.col)}
        <div><div class="eyebrow">Section ${s.n} · ${s.short}</div><h1>${s.title}</h1><p>${s.blurb}</p></div>
      </div>
    </div>
  </section>
  <section class="wrap" style="padding-bottom:24px">
    <div class="why">
      <div class="q"><b>“${s.quote}”</b><span>— ${s.qby}</span></div>
      <div class="o"><h4>What this section delivers</h4><ul>${s.outcomes.map(o=>`<li>${o}</li>`).join('')}</ul></div>
    </div>
    <div class="head" style="margin:56px 0 0">
      <div><div class="eyebrow" style="color:${c}">${s.els.length} possible elements</div><h2>What we can bring in</h2></div>
      <p><span class="tag mvp">Suggested MVP</span> marks elements we recommend for launch.</p>
    </div>
    <div class="els">
      ${s.els.map(([n,d,pv,tags,mvp])=>`<article class="el">
        <div class="pv">${P[pv](c)}</div>
        <div class="body"><h4>${n}</h4><p>${d}</p>
          <div class="tags">${mvp?'<span class="tag mvp">Suggested MVP</span>':''}${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div></article>`).join('')}
    </div>
    <div class="pager">
      <a href="#${prev.id}"><small>← Previous · ${prev.n}</small><b>${prev.title}</b></a>
      <a class="nx" href="#${next.id}"><small>Next · ${next.n} →</small><b>${next.title}</b></a>
    </div>
  </section></div>`;
}

/* ---------- drawer ---------- */
const nav=document.getElementById('drawerNav');
function renderNav(active){
  nav.innerHTML=`<a href="#home" class="${!active?'on':''}"><span class="n">⌂</span><span><b>Home</b><small>Overview of all sections</small></span></a>`+
   S.map(s=>`<a href="#${s.id}" class="${active===s.id?'on':''}"><span class="n">${s.n}</span>${icon(s.icon,s.col)}<span><b>${s.title}</b><small>${s.els.length} elements</small></span></a>`).join('');
}
function openMenu(){document.body.classList.add('menu-open')}
function closeMenu(){document.body.classList.remove('menu-open')}
document.getElementById('openMenu').onclick=openMenu;
document.getElementById('closeMenu').onclick=closeMenu;
document.getElementById('scrim').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
nav.addEventListener('click',closeMenu);

/* ---------- router ---------- */
function route(){
  const h=location.hash;
  const id=h.replace(/^#\/?/,'');
  const onSection = id && id!=='home' && section(id)!==false;
  if(onSection){ secView.hidden=false; homeView.classList.add('parked'); homeView.setAttribute('aria-hidden','true'); }
  else{
    secView.hidden=true; secView.innerHTML='';
    if(!homeView.firstChild) home();
    homeView.classList.remove('parked'); homeView.removeAttribute('aria-hidden');
  }
  renderNav(id);
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',route);
route();
</script>
